    <!--
      Anti-FOUC guard. In dev, the bundled stylesheet is injected by JS, so the

      paint the shell on a plain white background and keep #root hidden until the
      real stylesheet loads and reveals it (see `#root { opacity: 1 }` in
      styles.css). Never black, so no bar can flash.
    -->
