    <!-- Performance: preconnect to Google Fonts (Manrope + Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Performance: DNS prefetch -->
    <link rel="dns-prefetch" href="https://api.essor.eiden-group.com" />

    <!-- Structured data: Organization + SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://essor.eiden-group.com/#organization",
            "name": "Essor",
            "url": "https://essor.eiden-group.com",
            "logo": "https://essor.eiden-group.com/essor-logo.svg",
            "description": "Plateforme tout-en-un pour la gestion des écoles paramédicales au Maroc.",
            "email": "contact@eiden-group.com",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Avenue Mohammed V",
              "addressLocality": "Agadir",
              "addressCountry": "MA"
            },
            "sameAs": [
              "https://twitter.com/essor_app",
              "https://linkedin.com/company/essor-app"
            ]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Essor",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Plateforme tout-en-un pour la gestion des écoles supérieures paramédicales au Maroc : étudiants, plannings, examens, bulletins, stages cliniques et frais de scolarité.",
            "url": "https://essor.eiden-group.com",
            "offers": {
              "@type": "Offer",
              "price": "1000",
              "priceCurrency": "MAD",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": "1000",
                "priceCurrency": "MAD",
                "referenceQuantity": { "@type": "QuantitativeValue", "value": 1, "unitText": "mois" }
              }
            },
            "aggregateRating": {
              "@type": "AggregateRating",
              "ratingValue": "4.9",
              "ratingCount": "10"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://essor.eiden-group.com/#website",
            "url": "https://essor.eiden-group.com",
            "name": "Essor",
            "inLanguage": ["fr-MA", "ar-MA"],
            "publisher": { "@id": "https://essor.eiden-group.com/#organization" }
          }
        ]
      }
    </script>

    <!--
      Anti-FOUC guard. In dev, the bundled stylesheet is injected by JS, so the
      first React paint can happen before any styles apply — during that frame,
      `currentColor` SVG shapes render solid black (the flash the user saw). We
      paint the shell on a plain white background and keep #root hidden until the
      real stylesheet loads and reveals it (see `#root { opacity: 1 }` in
      styles.css). Never black, so no bar can flash.
    -->
    <style>
      html { background-color: #ffffff; }
      #root { opacity: 0; }
    </style>
  </head>
  <body class="min-h-full antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:Inter,system-ui,sans-serif;max-width:42rem;margin:0 auto;">

        <p style="color:#475569;line-height:1.6;">
          Cette application nécessite JavaScript pour fonctionner. Activez JavaScript puis
          <a href="https://essor.eiden-group.com" style="color:#2563EB;">retournez à la page d'accueil</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
