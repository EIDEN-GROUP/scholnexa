    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Anti-FOUC guard. In dev, the bundled stylesheet is injected by JS, so the
      first React paint can happen before any styles apply   during that frame,
      `currentColor` SVG shapes render solid black (the flash the user saw). We
      paint the shell on a plain white background and keep #root hidden until the
      real stylesheet loads and reveals it (see `#root { opacity: 1 }` in
      styles.css). Never black, so no bar can flash.
    -->
    <style>
      html { background-color: #ffffff; }
      #root { opacity: 0; }
    </style>
  </head>
  <body class="min-h-full antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
