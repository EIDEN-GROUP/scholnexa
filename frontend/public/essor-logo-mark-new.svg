<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Top-left petal gradient (lightest) -->
    <linearGradient id="petal1" x1="60" y1="40" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    
    <!-- Bottom-left petal gradient -->
    <linearGradient id="petal2" x1="75" y1="80" x2="75" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    
    <!-- Right petal gradient -->
    <linearGradient id="petal3" x1="125" y1="80" x2="125" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    
    <!-- Coral dot gradient -->
    <radialGradient id="coralDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A6E"/>
      <stop offset="60%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E25537"/>
    </radialGradient>
  </defs>
  
  <!-- Top-left petal (teardrop pointing up-right) -->
  <path d="M 50,90 Q 45,70 50,50 Q 55,35 70,35 Q 85,35 85,55 Q 85,75 70,85 Q 60,90 50,90 Z" fill="url(#petal1)"/>
  
  <!-- Bottom-left petal (teardrop pointing down) -->
  <path d="M 65,95 Q 50,100 45,115 Q 40,130 45,145 Q 50,160 70,160 Q 85,160 92,145 Q 95,130 87,115 Q 80,100 65,95 Z" fill="url(#petal2)"/>
  
  <!-- Right petal (teardrop pointing right-down) -->
  <path d="M 95,95 Q 110,100 125,110 Q 140,120 145,135 Q 150,150 140,160 Q 130,167 115,160 Q 100,150 95,135 Q 92,120 95,95 Z" fill="url(#petal3)"/>
  
  <!-- Coral accent dot -->
  <circle cx="95" cy="75" r="16" fill="url(#coralDot)"/>
</svg>