<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="Essor">
  <defs>
    <linearGradient id="epA" x1="60" y1="20" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="epB" x1="22" y1="50" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="epC" x1="78" y1="30" x2="78" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="epDot" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFB199"/>
      <stop offset="0.45" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#E25537"/>
    </radialGradient>
  </defs>
  <!-- 3 organic teardrop petals forming a clover -->
  <!-- Top petal -->
  <path d="M60 22 C 73 30, 76 46, 66 58 C 58 66, 50 64, 48 56 C 46 46, 50 30, 60 22 Z" fill="url(#epA)"/>
  <!-- Left petal (rotated teardrop) -->
  <path d="M30 60 C 22 48, 26 32, 40 30 C 52 30, 60 38, 58 48 C 56 58, 46 64, 36 64 C 32 64, 30 62, 30 60 Z" fill="url(#epB)"/>
  <!-- Right petal (rotated teardrop) -->
  <path d="M88 50 C 100 56, 102 70, 92 80 C 82 88, 70 84, 66 76 C 64 68, 72 58, 84 52 C 86 50, 88 50, 88 50 Z" fill="url(#epC)"/>
  <!-- Coral accent dot -->
  <circle cx="66" cy="46" r="6" fill="url(#epDot)"/>
</svg>
