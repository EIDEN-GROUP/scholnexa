<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.15" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gA" x1="120" y1="180" x2="120" y2="380">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gB" x1="40" y1="280" x2="220" y2="380">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="gC" x1="200" y1="200" x2="200" y2="420">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="gD" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFB199"/>
      <stop offset="0.45" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#E25537"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Decorative grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(880,180) scale(1.8)">
    <path d="M60 22 C 73 30, 76 46, 66 58 C 58 66, 50 64, 48 56 C 46 46, 50 30, 60 22 Z" fill="url(#gA)"/>
    <path d="M30 60 C 22 48, 26 32, 40 30 C 52 30, 60 38, 58 48 C 56 58, 46 64, 36 64 C 32 64, 30 62, 30 60 Z" fill="url(#gB)"/>
    <path d="M88 50 C 100 56, 102 70, 92 80 C 82 88, 70 84, 66 76 C 64 68, 72 58, 84 52 C 86 50, 88 50, 88 50 Z" fill="url(#gC)"/>
    <circle cx="66" cy="46" r="6" fill="url(#gD)"/>
  </g>

  <!-- Tag line -->
  <text x="100" y="200" font-family="Manrope, Inter, sans-serif" font-size="20" font-weight="600" fill="#2563EB" letter-spacing="2">ESSOR · SCHOOL CRM</text>

  <!-- Headline -->
  <text x="100" y="290" font-family="Manrope, Inter, sans-serif" font-size="80" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Tout avance,</text>
  <text x="100" y="380" font-family="Manrope, Inter, sans-serif" font-size="80" font-weight="800" fill="#FF6B4A" letter-spacing="-2">simplement.</text>

  <!-- Sub -->
  <text x="100" y="450" font-family="Inter, sans-serif" font-size="26" fill="#94A3B8">La plateforme tout-en-un pour gérer votre école, vos étudiants</text>
  <text x="100" y="485" font-family="Inter, sans-serif" font-size="26" fill="#94A3B8">et votre équipe — au quotidien.</text>

  <!-- Footer chip -->
  <g transform="translate(100,540)">
    <rect width="280" height="56" rx="28" fill="#2563EB"/>
    <text x="140" y="35" text-anchor="middle" font-family="Manrope, Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Réserver une démo →</text>
  </g>
</svg>
